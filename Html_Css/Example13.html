<html>
    <head>
        <title></title>
        <style>
            
            table
            {
                border-collapse: collapse;
                width: 100%;
            }

            tr,th,td
            {
                padding: 10px;
                text-align: left;
                
            }

            #heading
            {
                background-color: yellow;
                color: red;
            }
            tr
            {
                background-color: lightblue;
                color: white;
            }

            </style>
    </head>

     <table border="1" width="100%">
        <thead>Marksheet</thead>
        <tr id="heading">
            <th>No</th>

            <th>Subject</th>
        </tr>
        <tr>
            <td>1</td>
            <td>John Doe</td>
            <td>Maths</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Jane Smith</td>
            <td>Science</td>
    </body>
</html>
